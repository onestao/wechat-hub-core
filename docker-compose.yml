services:
  wechat-selkies:
    build:
      context: ../runtime
    image: ${WECHAT_RUNTIME_IMAGE:-wechat-runtime:local}
    platform: ${WECHAT_SELKIES_PLATFORM:-}
    container_name: wechat-selkies
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    shm_size: "${SHM_SIZE:-1gb}"
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-3001}:3001"
    volumes:
      - ./config:/config
      - ./tools/wechat-decrypt:/opt/wechat-decrypt:ro
      - ./agent_console:/opt/wechat-controller:ro
      - ./runtime/wechat-decrypt:/runtime/wechat-decrypt
      - wechat-runtime-state:/run/wechat-runtime
      - wechat-x11:/tmp/.X11-unix
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
      - TZ=${TZ:-Asia/Shanghai}
      - LC_ALL=${LC_ALL:-zh_CN.UTF-8}
      - AUTO_START_WECHAT=${AUTO_START_WECHAT:-true}
      - AUTO_START_QQ=${AUTO_START_QQ:-false}
      - CUSTOM_USER=${CUSTOM_USER:-}
      - PASSWORD=${PASSWORD}
      - WECHAT_ACCOUNTS=${WECHAT_ACCOUNTS:-account-a,account-b}
      - WECHAT_DEFAULT_ACCOUNT_ID=${WECHAT_DEFAULT_ACCOUNT_ID:-account-a}
      - WECHAT_ACCOUNT_UID_BASE=${WECHAT_ACCOUNT_UID_BASE:-20000}
      - WECHAT_ACCOUNTS_FILE=/config/wechat-runtime/accounts.json
      - WECHAT_ACCOUNT_HOME_ROOT=/config/wechat-accounts
      - WECHAT_ACCOUNT_DISPLAY_MAP=${WECHAT_ACCOUNT_DISPLAY_MAP:-}
      - WECHAT_LEGACY_DEFAULT_ACCOUNT=${WECHAT_LEGACY_DEFAULT_ACCOUNT:-false}

  wechat-memory-sync:
    image: ${WECHAT_AGENT_IMAGE:-docker.io/xiaoguiwucan/linux-wechat-agent:latest}
    container_name: wechat-memory-sync
    profiles: ["legacy"]
    restart: unless-stopped
    depends_on:
      - wechat-selkies
    volumes:
      - ./config:/app/config:ro
      - ./runtime:/app/runtime
    command:
      - python
      - memory/sync_worker.py
      - --interval
      - "${MEMORY_SYNC_INTERVAL:-5}"
      - --source-db-dir
      - /app/config/xwechat_files/${WECHAT_ACCOUNT_DIR_NAME:-PLEASE_SET_WECHAT_ACCOUNT_DIR}/db_storage
      - --decrypted-dir
      - /app/runtime/wechat-decrypt/decrypted
      - --keys-file
      - /app/runtime/wechat-decrypt/keys/all_keys.json
      - --decrypt-state-file
      - /app/runtime/wechat-decrypt/sync_state.json
      - --memory-db
      - /app/runtime/memory/wechat_memory.sqlite
      - --status-file
      - /app/runtime/memory/sync_status.json
      - --wechat-base-dir
      - /app/config/xwechat_files/${WECHAT_ACCOUNT_DIR_NAME:-PLEASE_SET_WECHAT_ACCOUNT_DIR}
      - --runtime-dir
      - /app/runtime
      - --media-dir
      - /app/runtime/media
      - --config-file
      - /app/runtime/wechat-decrypt/config.json

  wechat-ai-memory:
    image: ${WECHAT_AGENT_IMAGE:-docker.io/xiaoguiwucan/linux-wechat-agent:latest}
    container_name: wechat-ai-memory
    profiles: ["legacy"]
    restart: unless-stopped
    depends_on:
      - wechat-memory-sync
    ports:
      - "${AI_MEMORY_BIND:-127.0.0.1}:${AI_MEMORY_PORT:-8090}:8090"
    volumes:
      - ./runtime:/app/runtime
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - python
      - ai/app.py
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --index-interval
      - "${AI_MEMORY_INTERVAL:-5}"
      - --source-memory-db
      - /app/runtime/memory/wechat_memory.sqlite
      - --ai-db
      - /app/runtime/ai-memory/ai_memory.sqlite
      - --status-file
      - /app/runtime/ai-memory/ai_status.json

  wechat-agent-console:
    image: ${WECHAT_AGENT_IMAGE:-docker.io/xiaoguiwucan/linux-wechat-agent:latest}
    container_name: wechat-agent-console
    profiles: ["legacy"]
    restart: unless-stopped
    depends_on:
      - wechat-ai-memory
    ports:
      - "${AGENT_CONSOLE_BIND:-127.0.0.1}:${AGENT_CONSOLE_PORT:-8078}:8078"
    volumes:
      - ./runtime:/app/runtime
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WECHAT_SOURCE_DB_DIR=/app/config/xwechat_files/${WECHAT_ACCOUNT_DIR_NAME:-PLEASE_SET_WECHAT_ACCOUNT_DIR}/db_storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - python
      - agent_console/app.py
      - --host
      - 0.0.0.0
      - --port
      - "8078"

  wechat-core:
    build:
      context: .
    image: ${WECHAT_AGENT_IMAGE:-docker.io/xiaoguiwucan/linux-wechat-agent:latest}
    container_name: wechat-core
    restart: unless-stopped
    depends_on:
      - wechat-selkies
    pid: "service:wechat-selkies"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ports:
      - "${CORE_BIND:-127.0.0.1}:${CORE_PORT:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
      - ./runtime:/app/runtime
      - wechat-runtime-state:/run/wechat-runtime
      - wechat-x11:/tmp/.X11-unix
    command:
      - python
      - -m
      - core.app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --registry
      - /app/config/wechat-runtime/accounts.json
      - --require-registry
      - --database
      - /app/runtime/core/wechat_core.sqlite
      - --sync-interval
      - "${CORE_SYNC_INTERVAL:-5}"
      - --send-interval
      - "${CORE_SEND_INTERVAL:-1}"

volumes:
  wechat-runtime-state:
  wechat-x11:
